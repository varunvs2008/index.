<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Orbit Odyssey</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#050913;--card:rgba(9,15,30,.9);--line:#2a3f66;--tx:#e9eefb;--mu:#93a3c4;--ac:#ffb23e;--ok:#5be28a;--bad:#ff6b6b;--cy:#47d7ff;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:12px;padding:max(10px,env(safe-area-inset-top,0px)) 16px 0;pointer-events:none;text-shadow:0 1px 6px #000;z-index:5}
.cr{color:var(--ac);font-weight:700;font-size:16px;white-space:nowrap}
.hud-bars{margin-top:4px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.hp-wrap{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
.hp-bar{width:120px;height:8px;background:#16213b;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.hp-bar i{display:block;height:100%;background:var(--ok);transition:width .18s,background .2s}
#msg{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-size:22px;font-weight:700;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 2px 10px #000;max-width:90vw;z-index:6}
#hint{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;text-shadow:0 1px 6px #000;padding:0 12px;z-index:5}
#log{position:fixed;right:12px;top:64px;width:min(300px,45vw);font-size:12px;pointer-events:none;z-index:5}
#log div{background:var(--card);border-left:3px solid var(--ac);padding:6px 8px;margin-bottom:6px;border-radius:4px}
#fx{position:fixed;inset:0;background:radial-gradient(circle,#ffe29a,#ff5a1f 55%,#3a0d00);opacity:0;transition:opacity .6s;pointer-events:none;z-index:7}
#dmg{position:fixed;inset:0;background:radial-gradient(circle,transparent 45%,rgba(255,40,40,.55));opacity:0;transition:opacity .25s;pointer-events:none;z-index:7}
#cam-hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:4;border:18px solid rgba(5,12,24,.38);box-shadow:inset 0 0 60px rgba(0,0,0,.75)}
#cam-hud .cam-tag{position:absolute;top:56px;left:22px;background:rgba(8,18,34,.82);border:1px solid var(--cy);color:var(--cy);padding:4px 10px;border-radius:5px;font-size:12px;font-weight:700;letter-spacing:.8px}
#cam-hud .cam-reticle{position:absolute;left:50%;top:50%;width:120px;height:80px;transform:translate(-50%,-50%);border:1px solid rgba(71,215,255,.45);border-radius:6px}
#cam-hud .cam-reticle:before,#cam-hud .cam-reticle:after{content:"";position:absolute;background:rgba(71,215,255,.55)}
#cam-hud .cam-reticle:before{left:50%;top:-12px;bottom:-12px;width:1px}
#cam-hud .cam-reticle:after{top:50%;left:-12px;right:-12px;height:1px}
#panel{position:fixed;left:14px;top:60px;bottom:14px;width:min(390px,calc(100vw - 28px));overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:none;z-index:8}
@media(max-width:700px){#panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:62vh}}
h1{margin:0 0 6px;font-size:30px;letter-spacing:.5px;color:var(--ac)}h2{margin:0 0 6px;font-size:20px}h3{margin:12px 0 4px;font-size:14px;color:var(--mu);font-weight:600}
p{margin:6px 0}.mu{color:var(--mu);font-size:13px}.bad{color:var(--bad)}li{margin:4px 0}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.b{flex:1;min-width:86px;background:#0e1830;color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:7px 8px;cursor:pointer;font:inherit;text-align:left}
.b small{display:block;color:var(--mu)}.b.on{border-color:var(--ac);background:#2a2110}.b:hover{border-color:var(--ac)}
.go{width:100%;margin-top:12px;background:var(--ac);color:#1a1100;border:0;border-radius:7px;padding:10px;font:700 15px inherit;cursor:pointer}
.go:disabled{background:#3a3f4d;color:#7d8498;cursor:not-allowed}
.card{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:8px 0}
.bar{height:6px;background:#16213b;border-radius:3px;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.stat{margin-top:10px;padding:8px;background:#0e1830;border-radius:6px;font-size:13px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<canvas id="c"></canvas>
<div id="cam-hud"><div class="cam-tag" id="cam-tag">CAM-01 // FRONT MAST STEREO</div><div class="cam-reticle"></div></div>
<div id="top"></div><div id="msg"></div><div id="log"></div><div id="hint"></div><div id="fx"></div><div id="dmg"></div><div id="panel"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i);
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;
R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;
R.toneMappingExposure=1.08;

const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(60,1,.1,6000);
const rs=()=>{R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()};addEventListener('resize',rs);rs();

const hemi=new THREE.HemisphereLight(0xbfd8ff,0x223344,.72);
S.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.25);
sun.position.set(60,90,50);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=10;
sun.shadow.camera.far=360;
const dCam=95;
sun.shadow.camera.left=-dCam;
sun.shadow.camera.right=dCam;
sun.shadow.camera.top=dCam;
sun.shadow.camera.bottom=-dCam;
sun.shadow.bias=-0.0005;
S.add(sun);
S.add(sun.target);

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:.25},o));
const B=c=>new THREE.MeshBasicMaterial({color:c});
const mk=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o};
const Cy=(a,b,h,s=20)=>new THREE.CylinderGeometry(a,b,h,s),Co=(r,h,s=20)=>new THREE.ConeGeometry(r,h,s),Bx=(a,b,c)=>new THREE.BoxGeometry(a,b,c),Sp=(r,a=20,b=14)=>new THREE.SphereGeometry(r,a,b);
const clr=g=>{while(g.children.length)g.remove(g.children[0])},cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const K={};let ph='title';
addEventListener('keydown',e=>{K[e.code]=1;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();onKey(e.code)});addEventListener('keyup',e=>K[e.code]=0);

function setShadows(root,cast=true,rec=true){
 root.traverse(o=>{if(o.isMesh){o.castShadow=cast;o.receiveShadow=rec}});
}

/* stars + earth */
const stars=(()=>{
 const g=new THREE.BufferGeometry(),p=[],c=[];
 for(let i=0;i<3200;i++){
  const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);
  const galactic=Math.random()<.42;
  const lat=galactic?(Math.random()-.5)*.45:(b-Math.PI/2);
  const r=2600;
  const x=r*Math.cos(lat)*Math.cos(a),y=r*Math.sin(lat),z=r*Math.cos(lat)*Math.sin(a);
  p.push(x,y,z);
  const tint=Math.random();
  const col=tint<.2?new THREE.Color(0x9ec5ff):tint<.4?new THREE.Color(0xffdfa8):new THREE.Color(0xffffff);
  col.multiplyScalar(.55+Math.random()*.45);
  c.push(col.r,col.g,col.b);
 }
 g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
 g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));
 return new THREE.Points(g,new THREE.PointsMaterial({vertexColors:true,size:2.4,sizeAttenuation:false,transparent:true,opacity:0}));
})();S.add(stars);

function tex(col,n,w=512,h=256){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle=col;x.fillRect(0,0,w,h);
 for(let i=0;i<n;i++){x.fillStyle=Math.random()<.5?'rgba(0,0,0,.18)':'rgba(255,255,255,.16)';x.beginPath();x.ellipse(Math.random()*w,Math.random()*h,8+Math.random()*40,5+Math.random()*16,Math.random()*3,0,7);x.fill()}return new THREE.CanvasTexture(cv)}
const hx=c=>'#'+c.toString(16).padStart(6,'0');

const earthMaps=(()=>{
 const w=1024,h=512;
 const alCv=document.createElement('canvas');alCv.width=w;alCv.height=h;const ax=alCv.getContext('2d');
 const spCv=document.createElement('canvas');spCv.width=w;spCv.height=h;const sx=spCv.getContext('2d');
 const bmCv=document.createElement('canvas');bmCv.width=w;bmCv.height=h;const bx=bmCv.getContext('2d');
 const clCv=document.createElement('canvas');clCv.width=w;clCv.height=h;const cx=clCv.getContext('2d');

 const oceanGrad=ax.createLinearGradient(0,0,0,h);
 oceanGrad.addColorStop(0,'#173c6e');
 oceanGrad.addColorStop(.25,'#0b2b59');
 oceanGrad.addColorStop(.5,'#09356e');
 oceanGrad.addColorStop(.75,'#0b2b59');
 oceanGrad.addColorStop(1,'#173c6e');
 ax.fillStyle=oceanGrad;ax.fillRect(0,0,w,h);

 sx.fillStyle='#242424';sx.fillRect(0,0,w,h);
 bx.fillStyle='#404040';bx.fillRect(0,0,w,h);

 const continents=[
  {x:220,y:170,rx:85,ry:55,n:24},{x:290,y:320,rx:55,ry:85,n:20},
  {x:520,y:165,rx:115,ry:62,n:32},{x:545,y:285,rx:68,ry:88,n:24},
  {x:720,y:190,rx:110,ry:68,n:30},{x:810,y:355,rx:58,ry:42,n:16}
 ];
 continents.forEach(ct=>{
  for(let i=0;i<ct.n;i++){
   const px=ct.x+(Math.random()-.5)*ct.rx*1.5;
   const py=ct.y+(Math.random()-.5)*ct.ry*1.4;
   const r1=14+Math.random()*38,r2=10+Math.random()*28,rot=Math.random()*3.14;
   ax.fillStyle='rgba(26,118,148,.45)';
   ax.beginPath();ax.ellipse(px,py,r1*1.18,r2*1.18,rot,0,7);ax.fill();
   const isArid=Math.abs(py-h*.5)<65 && Math.random()<.45;
   ax.fillStyle=isArid?'#b89b5e':(Math.random()<.65?'#246134':'#38783e');
   ax.beginPath();ax.ellipse(px,py,r1,r2,rot,0,7);ax.fill();
   sx.fillStyle='#dcdcdc';
   sx.beginPath();sx.ellipse(px,py,r1,r2,rot,0,7);sx.fill();
   bx.fillStyle='rgba(225,225,225,.35)';
   bx.beginPath();bx.ellipse(px,py,r1*.65,r2*.65,rot,0,7);bx.fill();
  }
 });

 ax.fillStyle='rgba(238,246,255,.9)';
 sx.fillStyle='#b0b0b0';
 for(let x=0;x<w;x+=18){
  const nh=16+Math.sin(x*.04)*6;
  ax.beginPath();ax.arc(x,0,nh,0,7);ax.fill();
  ax.beginPath();ax.arc(x,h,nh+4,0,7);ax.fill();
  sx.beginPath();sx.arc(x,0,nh,0,7);sx.fill();
  sx.beginPath();sx.arc(x,h,nh+4,0,7);sx.fill();
 }

 cx.clearRect(0,0,w,h);
 for(let i=0;i<240;i++){
  const x=Math.random()*w,y=35+Math.random()*(h-70);
  const rx=16+Math.random()*65,ry=3+Math.random()*11;
  const tilt=(y<h*.5?-0.18:0.18)+(Math.random()-.5)*.15;
  cx.fillStyle=`rgba(255,255,255,${.18+Math.random()*.42})`;
  cx.beginPath();cx.ellipse(x,y,rx,ry,tilt,0,7);cx.fill();
 }

 const map=new THREE.CanvasTexture(alCv);
 const roughMap=new THREE.CanvasTexture(spCv);
 const bumpMap=new THREE.CanvasTexture(bmCv);
 const cloudMap=new THREE.CanvasTexture(clCv);
 return{map,roughMap,bumpMap,cloudMap};
})();

const earth=mk(Sp(1,64,48),new THREE.MeshStandardMaterial({
 map:earthMaps.map,
 roughnessMap:earthMaps.roughMap,
 bumpMap:earthMaps.bumpMap,
 bumpScale:0.015,
 roughness:0.85,
 metalness:0.12
}));
const earthClouds=mk(Sp(1.012,64,48),new THREE.MeshStandardMaterial({
 map:earthMaps.cloudMap,
 transparent:true,
 opacity:0.88,
 depthWrite:false,
 roughness:0.9,
 metalness:0
}));
earth.add(earthClouds);

const glow=mk(Sp(1.045,64,48),new THREE.ShaderMaterial({
 transparent:true,
 side:THREE.BackSide,
 blending:THREE.AdditiveBlending,
 depthWrite:false,
 vertexShader:'varying vec3 n;varying vec3 vPos;void main(){n=normalize(normalMatrix*normal);vPos=(modelViewMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*vec4(vPos,1.);}',
 fragmentShader:'varying vec3 n;void main(){float rim=pow(clamp(0.82-dot(n,vec3(0,0,1)),0.,1.),2.6);gl_FragColor=vec4(0.24,0.64,1.0,1.0)*rim*1.95;}'
}));
earth.add(glow);
const moon=mk(Sp(70,32,20),M(0xffffff,{map:tex('#5d6f8a',120),roughness:1,metalness:0}));S.add(moon);

/* Satellite builder (restored so stage 4 deployment works cleanly!) */
function mkSat(){
 const g=new THREE.Group();
 const goldFoil=M(0xd9a12b,{roughness:.3,metalness:.85});
 const bus=mk(Bx(1.3,1.3,2.1),goldFoil);
 const dish=mk(new THREE.SphereGeometry(.55,16,10,0,6.283,0,1.15),M(0xf4f6fa,{roughness:.3,metalness:.6,side:THREE.DoubleSide}),0,0,1.25);
 dish.rotation.x=Math.PI;
 g.add(bus,dish);
 [-1,1].forEach(s=>{
  g.add(mk(Bx(2.2,.06,1.3),M(0xffffff,{map:panTex(),emissive:0x0a1c44,roughness:.25,metalness:.65}),s*1.85,0,0));
 });
 g.scale.setScalar(1.5);
 setShadows(g,true,true);
 return g;
}

/* Highly Realistic Space Shuttle Stack with Ultra-Detailed Orbiter Geometry & Engine Glow */
function mkRocket(){
 const g=new THREE.Group();
 const whiteTile=M(0xf3f5f8,{roughness:.45,metalness:.2});
 const blackTile=M(0x1b1e26,{roughness:.75,metalness:.15});
 const tankOrange=M(0xc95b1e,{roughness:.68,metalness:.08});
 const tankDark=M(0x8f3a10,{roughness:.72,metalness:.08});
 const steel=M(0x8c96a6,{roughness:.35,metalness:.8});

 const etGroup=new THREE.Group();
 const etBody=mk(Cy(1.65,1.65,20,32),tankOrange,0,13.5,0);
 const etIntertank=mk(Cy(1.67,1.67,2.4,32),tankDark,0,16.5,0);
 const etNose=mk(Co(1.65,5.8,32),tankOrange,0,26.4,0);
 const etTip=mk(Co(.22,1.2,16),steel,0,29.8,0);
 const etAft=mk(Sp(1.65,24,16),tankDark,0,3.5,0);
 etGroup.add(etBody,etIntertank,etNose,etTip,etAft);
 g.add(etGroup);

 const bs=[];
 [-1,1].forEach(side=>{
  const b=new THREE.Group();
  const srbBody=mk(Cy(.74,.74,18.5,24),whiteTile,0,10.2,0);
  const srbNose=mk(Co(.74,3.2,24),whiteTile,0,21.05,0);
  const srbSkirt=mk(Cy(.76,.92,1.4,24),whiteTile,0,.7,0);
  const srbNozzle=mk(Co(.65,1.3,20),blackTile,0,-.35,0);
  srbBody.add(mk(Cy(.75,.75,.45,24),blackTile,0,6.5,0),mk(Cy(.75,.75,.45,24),blackTile,0,-5.5,0));
  
  const bfl=mk(Co(1.05,9.5,20),B(0xffcf6e),0,-5.2,0);
  bfl.rotation.x=Math.PI;
  bfl.visible=false;
  const bflCore=mk(Co(.55,6.0,16),B(0xffffff),0,-3.4,0);
  bflCore.rotation.x=Math.PI;
  bfl.add(bflCore);

  b.add(srbBody,srbNose,srbSkirt,srbNozzle,bfl);
  b.position.set(side*2.38,0,0);
  b.userData={d:new THREE.Vector3(side,0,0),fl:bfl};
  bs.push(b);
  g.add(b);
 });

 const orbiter=new THREE.Group();
 orbiter.position.set(0,11.2,2.25);

 const fuse=mk(Cy(1.18,1.25,11.5,28),whiteTile,0,0,0);
 const belly=mk(Bx(2.1,11.2,.42),blackTile,0,-.1,-.96);
 const noseCone=mk(Sp(1.18,28,18),whiteTile,0,5.75,0);
 noseCone.scale.set(1,1.85,.95);
 const noseCap=mk(Sp(.48,18,12),blackTile,0,7.55,-.08);

 const cockpit=mk(Bx(1.35,.55,.65),blackTile,0,5.35,.72);
 cockpit.rotation.x=-.42;
 const forwardRCS=mk(Bx(.32,.22,.45),steel,0,7.0,.35);
 orbiter.add(forwardRCS);

 const bayL=mk(Cy(1.19,1.19,7.6,24,1,false,0,Math.PI),whiteTile,-.03,.3,.05);
 const bayR=mk(Cy(1.19,1.19,7.6,24,1,false,Math.PI,Math.PI),whiteTile,.03,.3,.05);
 for(let r=-2.8;r<=2.8;r+=1.1){
  bayL.add(mk(Bx(1.22,.04,.06),steel,.02,r,-.58));
  bayR.add(mk(Bx(1.22,.04,.06),steel,-.02,r,-.58));
 }

 // Pre-mounted satellite visible inside payload bay when doors open
 const baySat=mkSat();
 baySat.scale.setScalar(.62);
 baySat.position.set(0,.3,.45);
 orbiter.add(baySat);

 const wingShape=new THREE.Shape();
 wingShape.moveTo(0,-5.2);
 wingShape.lineTo(5.6,-5.2);
 wingShape.lineTo(5.6,-3.6);
 wingShape.lineTo(1.8,1.8);
 wingShape.lineTo(0,3.6);
 wingShape.closePath();
 const wingGeo=new THREE.ExtrudeGeometry(wingShape,{depth:.22,bevelEnabled:true,bevelThickness:.05,bevelSize:.06,bevelSegments:3});
 const wingR=mk(wingGeo,whiteTile,.8,-.2,-.65);
 wingR.rotation.y=-Math.PI/2;
 wingR.rotation.z=Math.PI/2;
 const wingL=mk(wingGeo,whiteTile,-.8,-.2,-.65);
 wingL.scale.x=-1;
 wingL.rotation.y=Math.PI/2;
 wingL.rotation.z=-Math.PI/2;

 const elevonR=mk(Bx(2.2,.12,.45),blackTile,2.8,-5.4,-.78);
 const elevonL=mk(Bx(2.2,.12,.45),blackTile,-2.8,-5.4,-.78);
 orbiter.add(elevonR,elevonL);

 const tail=mk(Bx(.24,3.4,2.6),whiteTile,0,-4.4,1.65);
 tail.rotation.x=-.28;
 const rudder=mk(Bx(.08,3.2,.85),blackTile,0,-4.4,2.2);
 rudder.rotation.x=-.28;
 tail.add(rudder);

 [-.85,.85].forEach(ox=>{
  const omsPod=mk(Cy(.38,.46,2.2,16),whiteTile,ox,-5.0,.75);
  omsPod.rotation.x=.2;
  const omsBell=mk(Co(.16,.38,12),blackTile,0,-1.1,0);
  omsPod.add(omsBell);
  orbiter.add(omsPod);
 });

 [[-0.45,-5.85,.35],[0.45,-5.85,.35],[0,-5.85,-.35]].forEach(([ex,ey,ez])=>{
  const bell=mk(Co(.42,1.1,18),steel,ex,ey,ez);
  const throat=mk(Cy(.22,.22,.32,14),blackTile,0,.5,0);
  bell.add(throat);
  orbiter.add(bell);
 });

 const fl=mk(Co(.95,7.5,20),new THREE.MeshBasicMaterial({color:0x7cc8ff,transparent:true,opacity:.88}),0,-9.8,.1);
 fl.rotation.x=Math.PI;
 fl.visible=false;
 const flInner=mk(Co(.48,4.8,16),B(0xffffff),0,-8.4,.1);
 flInner.rotation.x=Math.PI;
 fl.add(flInner);

 const flareCv=document.createElement('canvas');flareCv.width=128;flareCv.height=128;const fx=flareCv.getContext('2d');
 const grd=fx.createRadialGradient(64,64,2,64,64,62);
 grd.addColorStop(0,'rgba(255,255,255,1)');
 grd.addColorStop(.2,'rgba(255,220,130,.9)');
 grd.addColorStop(.55,'rgba(255,110,30,.35)');
 grd.addColorStop(1,'rgba(255,80,0,0)');
 fx.fillStyle=grd;fx.fillRect(0,0,128,128);
 fx.strokeStyle='rgba(255,235,180,.75)';fx.lineWidth=2;
 fx.beginPath();fx.moveTo(4,64);fx.lineTo(124,64);fx.moveTo(64,4);fx.lineTo(64,124);fx.stroke();
 const starFlare=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(flareCv),blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));
 starFlare.position.set(0,-6.5,0);
 starFlare.scale.setScalar(18);
 starFlare.visible=false;

 orbiter.add(fuse,belly,noseCone,noseCap,cockpit,bayL,bayR,wingR,wingL,tail,fl,starFlare);
 g.add(orbiter);

 setShadows(g,true,true);
 g.userData={s1:etGroup,f:bayL,bayR,baySat,orbiter,bs,fl,starFlare};
 return g;
}

/* Realistic Coastal Launch Complex 39A with Volumetric Procedural Clouds & 100s of Spectators */
const pad=new THREE.Group();
const padClouds=[];
let crewArmPivot,ventArmPivot;
{

function mkSkyDome(p,sunDir){
 const geo=new THREE.SphereGeometry(950,32,20);
 const mat=new THREE.ShaderMaterial({
  side:THREE.BackSide,
  depthWrite:false,
  uniforms:{
   topColor:{value:new THREE.Color(p.zenith)},
   horizonColor:{value:new THREE.Color(p.horizon)},
   sunDir:{value:sunDir.clone().normalize()},
   sunColor:{value:new THREE.Color(p.sunCol)},
   hazePower:{value:cur===2?4.5:1.6}
  },
  vertexShader:`
   varying vec3 vWorldPos;
   void main(){
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPos = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
   }
  `,
  fragmentShader:`
   uniform vec3 topColor;
   uniform vec3 horizonColor;
   uniform vec3 sunDir;
   uniform vec3 sunColor;
   uniform float hazePower;
   varying vec3 vWorldPos;
   void main(){
    vec3 dir = normalize(vWorldPos);
    float h = clamp(dir.y, 0.0, 1.0);
    vec3 col = mix(horizonColor, topColor, pow(h, 0.55));
    float sunAmt = max(dot(dir, sunDir), 0.0);
    col += sunColor * pow(sunAmt, 14.0) * (0.35 / hazePower);
    col += sunColor * smoothstep(0.9965, 0.9994, sunAmt) * 2.2;
    gl_FragColor = vec4(col, 1.0);
   }
  `
 });
 return new THREE.Mesh(geo,mat);
}

U.land=dt=>{

 const p=PL[cur],t=sum();
 const g=p.g;

 const thrustOn=(K.KeyW||K.ArrowUp||K.Space)?1:0;
 const steerZ=((K.KeyA||K.ArrowLeft)?1:0)-((K.KeyD||K.ArrowRight)?1:0);
 const steerX=((K.KeyS||K.ArrowDown||K.KeyQ)?1:0)-(K.KeyE?1:0);

 const maxTilt=0.45;
 LD.tiltZ=cl(LD.tiltZ+steerZ*1.3*dt,-maxTilt,maxTilt);
 LD.tiltX=cl(LD.tiltX+steerX*1.3*dt,-maxTilt,maxTilt);
 if(!steerZ)LD.tiltZ*=1-2.5*dt;
 if(!steerX)LD.tiltX*=1-2.5*dt;

 pod.rotation.set(Math.PI/2+LD.tiltX,0,LD.tiltZ);

 const baseThrust=g+5.5+t.rng*0.65;
 const upVec=new THREE.Vector3(
  -Math.sin(LD.tiltZ),
  Math.cos(LD.tiltZ)*Math.cos(LD.tiltX),
  Math.sin(LD.tiltX)
 ).normalize();

 if(thrustOn){
  LD.vel.addScaledVector(upVec,baseThrust*dt);
  pod.userData.fl.visible=true;
  pod.userData.fl.scale.set(0.9+Math.random()*.2,0.9+Math.random()*.45,0.9+Math.random()*.2);
 }else{
  pod.userData.fl.visible=false;
 }

 LD.vel.x+=-steerZ*5.5*dt;
 LD.vel.z+=-steerX*5.5*dt;

 LD.vel.y-=g*dt;
 LD.vel.x*=1-0.9*dt;
 LD.vel.z*=1-0.9*dt;
 LD.vel.y*=1-0.12*dt;

 LD.pos.addScaledVector(LD.vel,dt);
 LD.pos.x=cl(LD.pos.x,-210,210);
 LD.pos.z=cl(LD.pos.z,-210,210);
 pod.position.copy(LD.pos);

 const groundY=H(LD.pos.x,LD.pos.z);
 const podBottomOffset=2.25;
 const alt=LD.pos.y-podBottomOffset-groundY;

 podShadow.position.set(LD.pos.x,groundY+0.15,LD.pos.z);
 const sScale=cl(1+alt*0.03,0.8,2.5);
 podShadow.scale.setScalar(sScale);

 const vSpeed=-LD.vel.y;
 const tiltDeg=Math.round(Math.hypot(LD.tiltX,LD.tiltZ)*57.3);
 const safeV=vSpeed<=6.5;
 podShadow.material.color.setHex(safeV?0x5be28a:0xff6b6b);

 if(thrustOn && alt<16 && (LD.sp+=dt)>.045){
  LD.sp=0;

 for(let i=0;i<obs.length;i++){

   LD.vel.z=nz*4;

    msg('Pod hull destroyed on boulder impact! Evacuating to ISS…',3200);
    setTimeout(backHome,3200);
    return;
   }
   msg(`Boulder scrape! -${bumpDmg} Hull (${Math.ceil(hp)} HP left)`,1600);
  }
 }

 hint(`Alt ${Math.max(0,alt).toFixed(1)} m · Descent ${vSpeed.toFixed(1)} m/s ${safeV?'(SAFE)':'(TOO FAST!)'} · Tilt ${tiltDeg}° · W/Space Thruster · A/D Steer`);

 if(alt<=0){

  LD.done=1;

U.deploy=dt=>{

 if(pod&&pod.userData.rampPivot){
  pod.userData.rampPivot.rotation.x=-rampEase*1.18;
 }

 const driveP=cl((p-0.30)/0.60,0,1);
 const driveEase=driveP*driveP*(3-2*driveP);
 const curX=DP.startPos.x;

 const targetQuat=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),norm);

 targetQuat.multiply(pitchQuat);
 rover.quaternion.slerp(targetQuat,0.2);

 if(driveP>0&&driveP<1){
  rover.userData.wheelRot-=dt*4.5;
  rover.userData.wheels.forEach(w=>w.rotation.x=rover.userData.wheelRot);
 }

 const solP=cl((p-0.70)/0.30,0,1);
 panelAngle=solP*58;
 rover.userData.solarHinge.rotation.x=THREE.MathUtils.degToRad(panelAngle);
 rover.userData.antGimbal.rotation.y+=dt*0.7;

 solarEff=cl(Math.sin(THREE.MathUtils.degToRad(panelAngle))*0.85,0,1);
 setTop();
 hint(`Deploying planetary rover… ${Math.round(p*100)}% (Ramp ${Math.round(rampEase*100)}% · Solar Wing ${Math.round(panelAngle)}°)`);

 sun.target.position.copy(rover.position);
 const camTarget=new THREE.Vector3(curX+6.5,groundY+3.2,curZ-5.5);
 C.position.lerp(camTarget,0.1);
 C.lookAt(curX,groundY+1.0,curZ+0.8);

 if(p>=1){
  px=curX;pz=curZ;yaw=0;py=0;vy=0;
  explore();
 }
};

function explore(){
 const p=PL[cur];
 ph='explore';
 inv=0;dead=0;
 setTop('Rover Exploration · '+p.n,'Drive to all 4 beacons · Z/X tilt solar panel · C camera view');
 msg('Rover deployed! Drive with W/S/A/D, angle solar panel with Z/X, press C for Rover Cams.',3800);
}

const done=()=>bc.filter(b=>b.done).length;
function scan(){
 if(near<0||bc[near].done||dead)return;
 if(bat<8){
  msg('Low battery! Deploy & angle your solar panel (Z/X or T) to recharge before scanning.',2600);
  return;
 }
 bat=Math.max(0,bat-8);
 bc[near].done=1;
 bc[near].orb.material.emissiveIntensity=0.05;
 bc[near].orb.material.color.set(0x444c5c);
 const d=document.createElement('div');
 d.style.borderColor=hx(bc[near].c);
 d.innerHTML=`<b>${CAT[near]}</b><br>${PL[cur].f[near][0]}`;
 $('log').appendChild(d);
 setTop();
 msg(done()==4?'All data collected! Press R to report to the Captain.':'Scan complete: '+CAT[near],3000);
}

function toggleCamMode(){
 camMode=(camMode+1)%3;
 const hud=$('cam-hud');
 if(camMode===0){
  hud.style.display='none';
 }else{
  hud.style.display='block';
  $('cam-tag').textContent=CAM_MODES[camMode];
 }
 msg('Camera: '+CAM_MODES[camMode],1400);
}

function onKey(c){
 if(ph==='launch'){
  const u=O.rocket.userData;
  if((c==='Digit1'||c==='Numpad1') && LN.alt>=120 && !LN.e1){
   LN.e1=1;
   u.bs.forEach(b=>{
    b.userData.fl.visible=false;
    const outVel=b.userData.d.clone().applyEuler(O.rocket.rotation).multiplyScalar(7).add(LN.vel.clone().multiplyScalar(0.85));
    det(b,outVel);
   });
   u.fl.visible=LN.thr>.03;
   msg('Twin Solid Rocket Boosters separated · SSMEs at full thrust!');
  }
  if((c==='Digit2'||c==='Numpad2') && LN.alt>=300 && !LN.e2){
   LN.e2=1;
   det(u.s1,LN.vel.clone().multiplyScalar(0.8));
   msg('External Tank jettisoned · Orbital insertion burn!');
  }
  if((c==='Digit3'||c==='Numpad3') && LN.alt>=450 && !LN.e3){
   LN.e3=1;
   u.f.rotation.y=-1.45;
   if(u.bayR)u.bayR.rotation.y=1.45;
   msg('Orbiter payload bay doors opened!');
  }
  if((c==='Digit4'||c==='Numpad4') && LN.alt>=650 && !LN.e4){
   LN.e4=1;
   if(!LN.e3){
    LN.e3=1;
    u.f.rotation.y=-1.45;
    if(u.bayR)u.bayR.rotation.y=1.45;
   }
   if(u.baySat)u.baySat.visible=false;
   u.fl.visible=false;
   if(u.starFlare)u.starFlare.visible=false;

   const st=mkSat();
   const tip=new THREE.Vector3(0,.3,2.6);
   u.orbiter.localToWorld(tip);
   st.position.copy(tip);
   S.add(st);

   // Eject satellite forward-upward into camera view while shuttle banks away below
   const depVel=new THREE.Vector3(3.2,5.5,4.5).applyEuler(O.rocket.rotation).add(LN.vel.clone().multiplyScalar(0.95));
   Db.push({o:st,v:depVel,r:new THREE.Vector3(.45,.75,.25),t:0});

   msg('Orbit achieved! Satellite deployed. Rendezvous with the ISS…',3600);
   setTimeout(()=>{
    O.rocket.visible=false;
    startDock();
   },3600);
  }
 }
 if(ph==='explore'&&!dead){
  if(c==='KeyE')scan();
  if(c==='KeyR'&&done()==4)report();
  if(c==='KeyC')toggleCamMode();
  if(c==='KeyT'){
   panelAngle=panelAngle>10?0:62;
   msg(panelAngle>0?'Solar panel deployed ('+panelAngle+'°)':'Solar panel stowed flat (0°)',1400);
  }
 }
}

let dustTimer=0;
U.explore=dt=>{
 if(dead)return;
 const p=PL[cur],g=p.g;
 const tr=(K.KeyA||K.ArrowLeft?1:0)-(K.KeyD||K.ArrowRight?1:0);
 const mv=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0);

 const panInput=((K.KeyX||K.BracketRight)?1:0)-((K.KeyZ||K.BracketLeft)?1:0);
 if(panInput!==0){
  panelAngle=cl(panelAngle+panInput*52*dt,0,85);
 }
 rover.userData.solarHinge.rotation.x=THREE.MathUtils.degToRad(panelAngle);

 const panelNorm=new THREE.Vector3(0,1,0).applyQuaternion(rover.userData.solarHinge.getWorldQuaternion(new THREE.Quaternion())).normalize();
 const sunAlign=Math.max(0,panelNorm.dot(sunWorldDir));
 const openFactor=cl(panelAngle/25,0,1);
 const planetSolarMult=[1.0,0.75,0.65,0.55][cur];
 solarEff=cl(openFactor*(0.35+0.65*sunAlign)*planetSolarMult,0,1);

 const isDriving=Math.abs(mv)>0.01||Math.abs(tr)>0.01;
 const drain=(isDriving?3.4:0.45)*dt;
 const charge=solarEff*6.8*dt;
 bat=cl(bat-drain+charge,0,100);

 const powerFactor=bat<5?0.35:(bat<20?0.65:1.0);
 const moveSpeed=10.5*powerFactor;

 yaw+=tr*1.85*dt*(mv<-0.1?-1:1);
 px=cl(px-Math.sin(yaw)*mv*moveSpeed*dt,-240,240);
 pz=cl(pz-Math.cos(yaw)*mv*moveSpeed*dt,-240,240);

 if(K.Space&&py<=.01&&vy<=0&&bat>=3){
  vy=3.2;
  bat=Math.max(0,bat-2.5);
 }
 vy-=g*dt;py+=vy*dt;if(py<0){py=0;vy=0}

 if(inv>0){
  inv=Math.max(0,inv-dt);
  rover.visible=Math.floor(inv*16)%2===0;
 }else{
  rover.visible=true;
 }

 const roverRad=1.05;
 for(let i=0;i<obs.length;i++){
  const o=obs[i];
  const dx=px-o.x,dz=pz-o.z;
  const dist=Math.hypot(dx,dz);
  const minDist=o.r+roverRad;
  if(dist<minDist && py<o.h){
   const nx=dist>0.001?dx/dist:1;
   const nz=dist>0.001?dz/dist:0;
   px=cl(o.x+nx*minDist,-240,240);
   pz=cl(o.z+nz*minDist,-240,240);

   if(o.dmg>0 && inv<=0){
    hp=Math.max(0,hp-o.dmg);
    inv=1.0;
    px=cl(px+nx*1.2,-240,240);
    pz=cl(pz+nz*1.2,-240,240);
    vy=Math.max(vy,1.4);
    setTop();
    $('dmg').style.opacity=1;
    setTimeout(()=>$('dmg').style.opacity=0,220);

    if(hp<=0){
     dead=1;
     rover.visible=true;
     $('cam-hud').style.display='none';
     msg('Rover chassis critically damaged! Emergency evacuation to ISS…',3200);
     setTimeout(backHome,3200);
     return;
    }else{
     msg(`Boulder impact! -${o.dmg} Rover Hull (${Math.ceil(hp)} HP left)`,1800);
    }
   }
  }
 }

 const groundY=H(px,pz)+py;
 rover.position.set(px,groundY,pz);

 const norm=terrainNormal(px,pz);
 const alignQ=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),norm);
 const yawQ=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),yaw);
 alignQ.multiply(yawQ);
 rover.quaternion.slerp(alignQ,0.22);

 rover.userData.wheelRot-=mv*moveSpeed*dt*3.1;
 rover.userData.wheels.forEach(w=>w.rotation.x=rover.userData.wheelRot);
 rover.userData.steerPivots.forEach(sp=>{
  sp.pivot.rotation.y=THREE.MathUtils.lerp(sp.pivot.rotation.y,tr*0.36*sp.dir,0.2);
 });

 rover.userData.antGimbal.rotation.y+=dt*0.55;

 if(Math.abs(mv)>0.1 && py<0.1 && (dustTimer+=dt)>0.22){
  dustTimer=0;
  const backPos=new THREE.Vector3((Math.random()-.5)*1.1,0.2,0.95).applyQuaternion(rover.quaternion).add(rover.position);
  puff(backPos,0.3,p.horizon);
 }

 if(dustPts){
  dustPts.position.set(px,groundY,pz);
  dustPts.rotation.y+=dt*0.03;
 }

 sun.target.position.copy(rover.position);
 setTop();

 const tt=performance.now()/400;
 near=-1;bc.forEach((b,i)=>{b.orb.scale.setScalar(b.done?1:1+.25*Math.sin(tt+i));if(Math.hypot(b.g.position.x-px,b.g.position.z-pz)<7.5&&near<0)near=i});
 const batWarn=bat<18?' [LOW BATTERY: Tilt Solar Panel Z/X!]':'';
 hint(near>=0?(bc[near].done?'Already scanned':'Press E to scan: '+CAT[near]):done()==4?'All beacons scanned! Press R to report to the Captain':`Beacons ${done()}/4 · Z/X Solar Panel (${Math.round(panelAngle)}°) · C Cam View${batWarn}`);

 if(camMode===1){
  const eye=new THREE.Vector3(0.36,1.72,-0.75).applyQuaternion(rover.quaternion).add(rover.position);
  const look=new THREE.Vector3(0.15,1.45,-9.0).applyQuaternion(rover.quaternion).add(rover.position);
  C.position.copy(eye);
  C.lookAt(look);
 }else if(camMode===2){
  const eye=new THREE.Vector3(-0.28,0.92,1.02).applyQuaternion(rover.quaternion).add(rover.position);
  const look=new THREE.Vector3(-0.1,0.65,9.0).applyQuaternion(rover.quaternion).add(rover.position);
  C.position.copy(eye);
  C.lookAt(look);
 }else{
  const bx=Math.sin(yaw),bz=Math.cos(yaw),tx=px+bx*8.5,tz=pz+bz*8.5,ty=Math.max(H(tx,tz)+2.2,groundY+4.2);
  C.position.lerp(new THREE.Vector3(tx,ty,tz),.14);
  C.lookAt(px,groundY+1.3,pz);
 }
};

function report(){
 $('cam-hud').style.display='none';
 ph='report';hint('');setTop('Report to the Captain',PL[cur].n);rReport()
}
function rReport(){const p=PL[cur];let h=`<h2>Report to the Captain</h2><p class="mu">Captain: “Commander, how does ${p.n} rate for each category?”</p>`;
 CAT.forEach((c,i)=>{h+=`<div class="card"><b>${c}</b><div class="mu">${p.f[i][0]}</div><div class="opts" style="margin-top:6px">${RT.map((r,j)=>`<button class="b ${ans[i]===j?'on':''}" onclick="ansr(${i},${j})">${r}</button>`).join('')}</div></div>`});
 pan(h+`<button class="go" ${[0,1,2,3].every(i=>ans[i]!==undefined)?'':'disabled'} onclick="submit()">Submit report</button>`)}
function ansr(i,j){ans[i]=j;const s=$('panel').scrollTop;rReport();$('panel').scrollTop=s}
function submit(){const p=PL[cur],t=sum();let n=0,h='<h2>Captain’s feedback</h2>';
 CAT.forEach((c,i)=>{const ok=ans[i]==p.f[i][1];n+=ok;h+=`<div class="card"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Correct':'Incorrect'}: ${c}</b><div class="mu">Your rating: ${RT[ans[i]]} · Captain’s rating: ${RT[p.f[i][1]]}</div></div>`});
 const e=Math.floor(n*100*p.rw*t.sc)+(n==4?150:0);cr+=e;let g='';if(cr<400){cr=400;g='<p class="mu">The space agency topped you up to 400 credits for your next pod.</p>'}
 setTop();pan(h+`<p>Reward: <b style="color:var(--ac)">+${e} credits</b>${n==4?' (includes 150 bonus for a perfect report)':''}</p>${g}<button class="go" onclick="backHome()">Return to the station</button>`)}
function backHome(){
 $('cam-hud').style.display='none';
 S.remove(pod);S.fog=null;toBuild()
}

let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;
 Db.forEach(d=>{d.v.y-=4*dt;d.o.position.addScaledVector(d.v,dt);d.o.rotation.x+=d.r.x*dt;d.o.rotation.z+=d.r.z*dt;d.t+=dt;if(d.t>12)S.remove(d.o)});
 earth.rotation.y+=dt*.01;
 earthClouds.rotation.y+=dt*.004;
 padClouds.forEach(c=>{c.g.position.x+=c.spd*dt;if(c.g.position.x>520)c.g.position.x=-520});
 glow.visible=!['title','explore','deploy','travel','land'].includes(ph)&&!(ph=='launch'&&LN.alt<250);moon.visible=['title','launch','dock','build','pick'].includes(ph);moon.position.set(C.position.x+170,C.position.y+75,C.position.z-650);
 for(let i=Pf.length-1;i>=0;i--){const p=Pf[i];p.t+=dt;p.o.position.addScaledVector(p.v,dt);p.o.scale.addScalar(dt*2.4);p.o.material.opacity=Math.max(0,.65-p.t*.24);p.o.material.color.lerp(pg,.04);if(p.t>2.8){S.remove(p.o);p.o.material.dispose();Pf.splice(i,1)}}
 U[ph]&&U[ph](dt);stars.position.copy(C.position);R.render(S,C)}
title();requestAnimationFrame(loop);
</script></body></html>
